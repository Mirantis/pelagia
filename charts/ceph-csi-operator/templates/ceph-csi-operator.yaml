---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceph-csi-controller-manager
  namespace: {{ .Values.csiOperatorConfig.rookNamespace }}
  labels:
{{ include "ceph-csi-operator.labels" . | indent 4 }}
{{ include "chart.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.csiOperatorConfig.replicas }}
  selector:
    matchLabels:
      control-plane: ceph-csi-op-controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: ceph-csi-op-controller-manager
    spec:
      containers:
        - args:
{{- toYaml .Values.csiOperatorConfig.managerArgs | nindent 12 }}
          command:
            - /manager
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CSI_SERVICE_ACCOUNT_PREFIX
              value: ceph-csi-
            - name: WATCH_NAMESPACE
              value: {{ .Values.csiOperatorConfig.rookNamespace }}
            {{- if .Values.csiOperatorConfig.kubernetesClusterDomain }}
            - name: KUBERNETES_CLUSTER_DOMAIN
              value: {{ .Values.csiOperatorConfig.kubernetesClusterDomain }}
            {{- end }}
          image: {{ template "operator.image" . }}
          imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with $.Values.csiOperatorConfig.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.csiOperatorConfig.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- if .Values.csiOperatorConfig.placement.affinity }}
      affinity:
{{ toYaml .Values.csiOperatorConfig.placement.affinity | indent 8 }}
    {{- end }}
    {{- if .Values.csiOperatorConfig.placement.tolerations }}
      tolerations:
{{ toYaml .Values.csiOperatorConfig.placement.tolerations | indent 6 }}
    {{- end }}
      securityContext:
        runAsNonRoot: true
    {{- if .Values.csiOperatorConfig.imagePullSecrets }}
      imagePullSecrets: {{- toYaml .Values.csiOperatorConfig.imagePullSecrets | nindent 6 }}
    {{- end }}
    {{- if .Values.csiOperatorConfig.placement.nodeSelector }}
      nodeSelector: {{- toYaml .Values.csiOperatorConfig.placement.nodeSelector | nindent 8 }}
    {{- end }}
    {{- if .Values.csiOperatorConfig.priorityClassName }}
      priorityClassName: {{ .Values.csiOperatorConfig.priorityClassName }}
    {{- end }}
      serviceAccountName: ceph-csi-controller-manager
      terminationGracePeriodSeconds: 10
    {{- if .Values.csiOperatorConfig.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml .Values.csiOperatorConfig.topologySpreadConstraints | nindent 6 }}
    {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ceph-csi-manager-rolebinding
  labels:
{{ include "chart.labels" . | indent 4 }}
{{ include "ceph-csi-operator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ceph-csi-manager-role
subjects:
  - kind: ServiceAccount
    name: ceph-csi-controller-manager
    namespace: {{ .Values.csiOperatorConfig.rookNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ceph-csi-metrics-auth-rolebinding
  labels:
{{ include "chart.labels" . | indent 4 }}
{{ include "ceph-csi-operator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ceph-csi-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: ceph-csi-controller-manager
    namespace: {{ .Values.csiOperatorConfig.rookNamespace }}

#################################################################################################################
# The deployment for the rook operator
# Contains the common settings for most Kubernetes deployments.
# For example, to create the rook-ceph cluster:
#   kubectl create -f common.yaml
#   kubectl create -f operator.yaml
#   kubectl create -f cluster.yaml
#
# Also see other operator sample files for variations of operator.yaml:
# - operator-openshift.yaml: Common settings for running in OpenShift
###############################################################################################################

# Rook Ceph Operator Config ConfigMap
# Use this ConfigMap to override Rook-Ceph Operator configurations.
# NOTE! Precedence will be given to this config if the same Env Var config also exists in the
#       Operator Deployment.
# To move a configuration(s) from the Operator Deployment to this ConfigMap, add the config
# here. It is recommended to then remove it from the Deployment to eliminate any future confusion.
#
# TODO: use basic configmap name without suffix -migration
# due to conflict with Rook upstream helm annotations
# used as source to copy to origin
#
kind: ConfigMap
apiVersion: v1
metadata:
  name: rook-csi-operator-image-set-configmap-migration
  # should be in the namespace of the operator
  namespace: {{ .Values.rookConfig.rookNamespace }}
  labels:
{{ include "rook.labels" . | indent 4 }}
{{ include "chart.labels" . | indent 4 }}
data:
  plugin: {{ template "csi.ceph.image" . }}
  provisioner: {{ template "csiprovisioner.ceph.image" . }}
  attacher: {{ template "csiattacher.ceph.image" . }}
  resizer: {{ template "csiresizer.ceph.image" . }}
  snapshotter: {{ template "csisnapshotter.ceph.image" . }}
  registrar: {{ template "csiregistrar.ceph.image" . }}
  addons: "quay.io/csiaddons/k8s-sidecar:v0.14.0"
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: rook-ceph-operator-config
  # should be in the namespace of the operator
  namespace: {{ .Values.rookConfig.rookNamespace }}
  labels:
{{ include "rook.labels" . | indent 4 }}
{{ include "chart.labels" . | indent 4 }}
data:
  # Whether the OBC provisioner should watch on the operator namespace or not, if not the namespace of the cluster will be used
  ROOK_OBC_WATCH_OPERATOR_NAMESPACE: "true"
  # If true, delete unused generated CRUSH rules after the mgr starts
  ROOK_DELETE_UNUSED_CRUSH_RULES: "false"
  # Whether to start the discovery daemon to watch for raw storage devices on nodes in the cluster.
  # This daemon does not need to run if you are only going to create your OSDs based on StorageClassDeviceSets with PVCs.
  ROOK_ENABLE_DISCOVERY_DAEMON: "true"
  # Provide customised regex as the values using comma. For eg. regex for rbd based volume, value will be like "(?i)rbd[0-9]+".
  # In case of more than one regex, use comma to seperate between them.
  # Default regex will be "(?i)dm-[0-9]+,(?i)rbd[0-9]+,(?i)nbd[0-9]+"
  # Add regex expression after putting a comma to blacklist a disk
  # If value is empty, the default regex will be used.
  DISCOVER_DAEMON_UDEV_BLACKLIST: "(?i)dm-[0-9]+,(?i)rbd[0-9]+,(?i)nbd[0-9]+"
---
# OLM: BEGIN OPERATOR DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rook-ceph-operator
  namespace: {{ .Values.rookConfig.rookNamespace }}
  labels:
{{ include "rook.labels" . | indent 4 }}
{{ include "chart.labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      app: rook-ceph-operator
  replicas: {{ .Values.rookConfig.rookOperatorReplicas }}
  template:
    metadata:
  {{- if (.Values.rookConfig.caBundleRef) }}
      annotations:
        custom-cabundle-cert: {{ .Values.rookConfig.caBundleRef }}
  {{- end }}
      labels:
        app: rook-ceph-operator
    spec:
      securityContext:
        runAsUser: 2016
        runAsGroup: 2016
        fsGroup: 2016
      serviceAccountName: rook-ceph-system
  {{- if .Values.rookConfig.rookOperatorPlacement.affinity }}
      affinity:
{{ toYaml .Values.rookConfig.rookOperatorPlacement.affinity | indent 8 }}
  {{- end }}
  {{- if (.Values.rookConfig.caBundleRef) }}
      initContainers:
      - name: cabundle-update
        image: {{ template "rook.image" . }}
        args:
        - /usr/bin/update-ca-trust extract -o /tmp/new-ca-bundle/
        command:
        - /bin/bash
        - -c
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /etc/pki/ca-trust/source/anchors/
          name: rook-ceph-extra-ca-bundle
          readOnly: true
        - mountPath: /tmp/new-ca-bundle/
          name: rook-ceph-ca-bundle-updated
        securityContext:
          runAsUser: 2016
          runAsGroup: 2016
          runAsNonRoot: true
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
  {{- end }}
      containers:
      - name: rook-ceph-operator
        image: {{ template "rook.image" . }}
        args: ["ceph", "operator"]
        volumeMounts:
        - mountPath: /var/lib/rook
          name: rook-config
        - mountPath: /etc/ceph
          name: default-config-dir
  {{- if (.Values.rookConfig.caBundleRef) }}
        - mountPath: /etc/pki/ca-trust/extracted/
          name: rook-ceph-ca-bundle-updated
          readOnly: true
  {{- end }}
        ports:
        - containerPort: 9443
          name: https-webhook
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          runAsUser: 2016
          runAsGroup: 2016
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        # If the operator should only watch for cluster CRDs in the same namespace, set this to "true".
        # If this is not set to true, the operator will watch for cluster CRDs in all namespaces.
        - name: ROOK_CURRENT_NAMESPACE_ONLY
          value: "true"
        # (Optional) Rook Discover toleration key. Set this to the key of the taint you want to tolerate
        # - name: DISCOVER_TOLERATION_KEY
        #   value: "<KeyOfTheTaintToTolerate>"
        # (Optional) Rook Discover tolerations list. Put here list of taints you want to tolerate in YAML format.
        {{ if .Values.rookConfig.rookDiscoverPlacement.tolerations }}
        - name: DISCOVER_TOLERATIONS
          value: |
{{ .Values.rookConfig.rookDiscoverPlacement.tolerations | indent 12 }}
        {{- end }}
        # (Optional) Rook Discover priority class name to set on the pod(s)
        # - name: DISCOVER_PRIORITY_CLASS_NAME
        #   value: "<PriorityClassName>"
        # (Optional) Discover Agent NodeAffinity.
        - name: DISCOVER_AGENT_NODE_AFFINITY
          value: {{ .Values.rookConfig.rookDiscoverPlacement.nodeAffinity }}
        # The logging level for the operator: INFO | DEBUG
        - name: ROOK_LOG_LEVEL
          value: "INFO"
        # The duration between discovering devices in the rook-discover daemonset.
        - name: ROOK_DISCOVER_DEVICES_INTERVAL
          value: "60m"
        # Whether to start pods as privileged that mount a host path, which includes the Ceph mon and osd pods.
        # Set this to true if SELinux is enabled (e.g. OpenShift) to workaround the anyuid issues.
        # For more details see https://github.com/rook/rook/issues/1314#issuecomment-355799641
        - name: ROOK_HOSTPATH_REQUIRES_PRIVILEGED
          value: "false"
        # Disable automatic orchestration when new devices are discovered
        - name: ROOK_DISABLE_DEVICE_HOTPLUG
          value: "true"
        # Time to wait until the node controller will move Rook pods to other
        # nodes after detecting an unreachable node.
        # Pods affected by this setting are:
        # mgr, rbd, mds, rgw, nfs, PVC based mons and osds, and ceph toolbox
        # The value used in this variable replaces the default value of 300 secs
        # added automatically by k8s as Toleration for
        # <node.kubernetes.io/unreachable>
        # The total amount of time to reschedule Rook pods in healthy nodes
        # before detecting a <not ready node> condition will be the sum of:
        #  --> node-monitor-grace-period: 40 seconds (k8s kube-controller-manager flag)
        #  --> ROOK_UNREACHABLE_NODE_TOLERATION_SECONDS: 5 seconds
        - name: ROOK_UNREACHABLE_NODE_TOLERATION_SECONDS
          value: "5"
        # The name of the node to pass with the downward API
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # The pod name to pass with the downward API
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # The pod namespace to pass with the downward API
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        #  Uncomment it to run lib bucket provisioner in multithreaded mode
        #- name: LIB_BUCKET_PROVISIONER_THREADS
        #  value: "5"
  {{- if .Values.rookConfig.livenessProbe }}
        livenessProbe:
{{ toYaml .Values.rookConfig.livenessProbe | indent 10 }}
  {{- end }}
  {{- if .Values.rookConfig.readinessProbe }}
        readinessProbe:
{{ toYaml .Values.rookConfig.readinessProbe | indent 10 }}
  {{- end }}
  {{- if .Values.rookConfig.rookOperatorPlacement.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.rookConfig.rookOperatorPlacement.nodeSelector | indent 8 }}
  {{- end }}
  {{- if .Values.rookConfig.rookOperatorPlacement.tolerations }}
      tolerations:
{{ toYaml .Values.rookConfig.rookOperatorPlacement.tolerations | indent 8 }}
  {{- end }}
      # Uncomment it to run rook operator on the host network
      #hostNetwork: true
      volumes:
      - name: rook-config
        emptyDir: {}
      - name: default-config-dir
        emptyDir: {}
  {{- if (.Values.rookConfig.caBundleRef) }}
      - name: rook-ceph-extra-ca-bundle
        secret:
          defaultMode: 420
          items:
          - key: cabundle
            mode: 256
            path: extra-cabundle.crt
          secretName: {{ .Values.rookConfig.caBundleRef }}
      - emptyDir: {}
        name: rook-ceph-ca-bundle-updated
  {{- end }}
# OLM: END OPERATOR DEPLOYMENT

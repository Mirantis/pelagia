# This is a basic workflow to help you get started with Actions

name: Docs CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ "main", "release-*" ]
    tags: ['*']
    paths:
    - 'mkdocs.yml'
    - 'docs/**'
    - 'build/scripts/docs_macros.py'
    # Rook documentation links are generated from the Rook version in go.mod
    - 'go.mod'
  pull_request:
    branches: [ "main", "release-*" ]
    paths:
    - 'mkdocs.yml'
    - 'docs/**'
    - 'build/scripts/docs_macros.py'
    - 'go.mod'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# abort in progress when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-docs:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
      - run: pip install --upgrade pip && pip install -r docs/requirements.txt
      - run: git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Check Rook documentation links are not hard-coded
        # Upgrade notes describe a specific Rook release, so they may link to it directly.
        run: |
          if git grep -n -E 'rook\.github\.io/docs|rook\.io/docs/rook/(latest|v[0-9])' -- docs ':!docs/upgrade-guide'; then
            echo "::error::Use '{{ rook_docs }}/...' for Rook documentation links instead of a hard-coded or 'latest' URL. See build/scripts/docs_macros.py."
            exit 1
          fi
      - name: Build docs
        if: github.event_name == 'pull_request'
        run: mkdocs build
      - name: Check Rook documentation links and anchors
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-fragments --include '^https://rook\.io/docs/' site/
          fail: true
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: percommit-docs
          path: site/
          retention-days: 5
      - name: Publish docs
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        env:
          DOCS_VERSION: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
        run: mike deploy --push "${DOCS_VERSION#release-}"
